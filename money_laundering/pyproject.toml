[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "source"
version = "0.0.1"
description = "This project focuses on developing an advanced technological solution for AML. It leverages data analytics and machine learning to automate transaction monitoring, improve the accuracy of suspicious activity detection, and provide dynamic risk-scoring for clients, thereby increasing operational efficiency."
authors = [
  { name = "Sergio_Cruz" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["source"]
force_sort_within_sections = true


